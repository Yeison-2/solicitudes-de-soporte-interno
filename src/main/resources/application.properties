spring.application.name=solicitudes-soporte

# Base de datos PostgreSQL.
# Valores locales de ejemplo; en entornos compartidos las credenciales
# reales van por variables de entorno (DB_USERNAME / DB_PASSWORD).
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/solicitudesdb
spring.datasource.username=${DB_USERNAME:user_software}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate=ERROR

server.port=8086