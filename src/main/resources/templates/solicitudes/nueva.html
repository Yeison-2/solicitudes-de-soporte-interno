<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{layout/layout :: head}"></head>

<body>
<header th:replace="~{layout/layout :: nav}"></header>

<main class="contenido">
    <h1>Nueva solicitud</h1>
    <p class="entrada">Describa lo que necesita. El numero, la fecha y el estado los asigna el sistema.</p>

    <div th:replace="~{layout/layout :: avisos}"></div>

    <form class="formulario" th:action="@{/solicitudes/nueva}" th:object="${solicitud}" method="post">
        <div class="campo">
            <label for="titulo">Titulo</label>
            <input id="titulo" type="text" th:field="*{titulo}" maxlength="100">
            <p class="error-campo" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}">Error</p>
        </div>

        <div class="campo">
            <label for="descripcion">Descripcion</label>
            <textarea id="descripcion" th:field="*{descripcion}" rows="6" maxlength="1000"></textarea>
            <p class="error-campo" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}">Error</p>
        </div>

        <div class="campo">
            <label for="categoria">Categoria</label>
            <select id="categoria" th:field="*{categoria}">
                <option value="">Seleccione una categoria</option>
                <option th:each="categoria : ${categorias}" th:value="${categoria}" th:text="${categoria}">Opcion</option>
            </select>
            <p class="error-campo" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}">Error</p>
        </div>

        <div class="campo">
            <label for="prioridad">Prioridad</label>
            <select id="prioridad" th:field="*{prioridad}">
                <option value="">Seleccione una prioridad</option>
                <option th:each="prioridad : ${prioridades}" th:value="${prioridad}"
                        th:text="${prioridad}">Opcion</option>
            </select>
            <p class="error-campo" th:if="${#fields.hasErrors('prioridad')}" th:errors="*{prioridad}">Error</p>
        </div>

        <div class="campo">
            <label for="justificacionPrioridad">Justificacion de la prioridad</label>
            <input id="justificacionPrioridad" type="text" th:field="*{justificacionPrioridad}" maxlength="300">
            <p class="error-campo" th:if="${#fields.hasErrors('justificacionPrioridad')}"
               th:errors="*{justificacionPrioridad}">Error</p>
        </div>

        <div class="campo">
            <label for="fechaObjetivo">Fecha objetivo</label>
            <input id="fechaObjetivo" type="date" th:field="*{fechaObjetivo}">
            <p class="nota-campo">Obligatorios si la prioridad es ALTA.</p>
            <p class="error-campo" th:if="${#fields.hasErrors('fechaObjetivo')}" th:errors="*{fechaObjetivo}">Error</p>
        </div>

        <div class="acciones">
            <button type="submit" class="boton boton-principal">Registrar solicitud</button>
            <a class="boton boton-suave" th:href="@{/solicitudes}">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{layout/layout :: pie}"></footer>
</body>
</html>
