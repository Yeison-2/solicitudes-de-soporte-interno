<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{layout/layout :: head}"></head>

<body>
<header th:replace="~{layout/layout :: nav}"></header>

<main class="contenido">
    <div class="cabecera-pagina">
        <h1>Mis solicitudes</h1>
        <a class="boton boton-principal" th:href="@{/solicitudes/nueva}">Registrar solicitud</a>
    </div>

    <div th:replace="~{layout/layout :: avisos}"></div>

    <p class="vacio" th:if="${#lists.isEmpty(solicitudes)}">
        Todavia no ha registrado solicitudes.
        <a th:href="@{/solicitudes/nueva}">Registre la primera</a>.
    </p>

    <div class="tabla-envoltorio" th:unless="${#lists.isEmpty(solicitudes)}">
        <table class="tabla">
            <thead>
            <tr>
                <th>Numero</th>
                <th>Titulo</th>
                <th>Categoria</th>
                <th>Prioridad</th>
                <th>Estado</th>
                <th>Ultima actualizacion</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="solicitud : ${solicitudes}">
                <td class="celda-numero" th:text="${solicitud.idSolicitud}">1</td>
                <td th:text="${solicitud.titulo}">Titulo</td>
                <td th:text="${solicitud.categoria}">Categoria</td>
                <td>
                    <span class="etiqueta"
                          th:classappend="' etiqueta-' + ${#strings.toLowerCase(solicitud.prioridad.name())}"
                          th:text="${solicitud.prioridad}">Prioridad</span>
                </td>
                <td th:text="${solicitud.estado}">Estado</td>
                <td th:text="${solicitud.fechaActualizacionTexto}">Fecha</td>
                <td><a th:href="@{/solicitudes/{id}(id=${solicitud.idSolicitud})}">Ver detalle</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{layout/layout :: pie}"></footer>
</body>
</html>
