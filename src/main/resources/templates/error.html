<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>No se pudo mostrar la pagina</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="cuerpo-acceso">
<main class="acceso">
    <header class="acceso-cabecera">
        <h1>No se pudo mostrar la pagina</h1>
    </header>
    <p class="entrada">
        La solicitud no se pudo completar.
        <span th:if="${status}" th:text="'(codigo ' + ${status} + ')'">(codigo)</span>
        <span th:if="${error}" th:text="${error}">Error</span>
    </p>
    <p><a th:href="@{/inicio}">Volver al inicio</a></p>
</main>
</body>
</html>
